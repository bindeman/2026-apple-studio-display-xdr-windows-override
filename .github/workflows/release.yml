name: Build and Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content -Raw .\VERSION).Trim()
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            throw "Tag '$tag' does not match VERSION file 'v$version'. Update VERSION before tagging."
          }
          Write-Host "Tag $tag matches VERSION $version"

      # The release gate builds both package flavors and verifies each of them:
      #   dist/studio-display-xdr-windows.zip          full package: control panel GUI + setup launcher + scripts
      #   dist/studio-display-xdr-windows-scripts.zip  scripts-only package: PowerShell + launchers, no GUI
      # Interactive app smoke tests are skipped because hosted runners have no Studio Display XDR
      # and no interactive desktop.
      - name: Build and verify both packages
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\Test-StudioDisplayXdrRelease.ps1 -SkipInteractiveApp -Quiet

      - name: Upload full package (GUI)
        uses: actions/upload-artifact@v4
        with:
          name: studio-display-xdr-windows
          path: dist/studio-display-xdr-windows.zip

      - name: Upload scripts-only package (no GUI)
        uses: actions/upload-artifact@v4
        with:
          name: studio-display-xdr-windows-scripts
          path: dist/studio-display-xdr-windows-scripts.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Studio Display XDR for Windows ${{ github.ref_name }}
          files: |
            dist/studio-display-xdr-windows.zip
            dist/studio-display-xdr-windows-scripts.zip
          body_path: RELEASE_NOTES.md
